<section class="card">
  <h2>Perfil</h2>
  <p class="muted">Datos de la cuenta activa.</p>
  <p class="error-msg" *ngIf="error">{{ error }}</p>
  <p class="muted" *ngIf="loading">Cargando perfil...</p>

  <div class="profile-grid" *ngIf="profile">
    <div>
      <span>Nombre</span>
      <strong>{{ profile.name }}</strong>
    </div>
    <div>
      <span>Correo</span>
      <strong>{{ profile.email }}</strong>
    </div>
    <div>
      <span>Estado</span>
      <strong>Sesión activa</strong>
    </div>
  </div>
</section>
