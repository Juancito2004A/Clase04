<!-- Navigation Header (Only visible when logged in) -->
<header class="navbar" *ngIf="authService.isAuthenticated()">
  <div class="nav-container">
    <div class="nav-brand">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="brand-icon"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>Panel de Inventario</span>
    </div>

    <nav class="nav-links">
      <a routerLink="/products" routerLinkActive="active">Productos</a>
      <a routerLink="/reports" routerLinkActive="active">Reportes</a>
      <a routerLink="/profile" routerLinkActive="active">Perfil</a>
    </nav>
    
    <div class="nav-user-actions">
      <div class="user-info">
        <span class="user-avatar">👤</span>
        <span class="user-name">Hola, <strong>{{ authService.currentUser()?.name }}</strong></span>
      </div>
      <button type="button" class="btn-logout" (click)="logout()" title="Cerrar Sesión">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M6 12.5a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-8a.5.5 0 0 0-.5.5v2a.5.5 0 0 1-1 0v-2A1.5 1.5 0 0 1 6.5 2h8A1.5 1.5 0 0 1 16 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 5 12.5v-2a.5.5 0 0 1 1 0z"/><path fill-rule="evenodd" d="M.146 8.354a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L1.707 7.5H10.5a.5.5 0 0 1 0 1H1.707l2.147 2.146a.5.5 0 0 1-.708.708z"/></svg>
        Salir
      </button>
    </div>
  </div>
</header>

<!-- Main Router Content -->
<main class="main-content">
  <router-outlet></router-outlet>
</main>
